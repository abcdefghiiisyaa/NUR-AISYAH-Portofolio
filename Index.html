<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efek Foto Interaktif</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Wadah Utama Kartu -->
    <div class="card-container" id="myCard">
        <div class="card-inner">
            
            <!-- Sisi Depan (Foto Pertama) -->
            <div class="card-front">
                <img src="foto-depan.jpg" alt="Foto Sampul">
            </div>
            
            <!-- Sisi Belakang (Foto Kedua / Berbeda) -->
            <div class="card-back">
                <img src="foto-belakang.jpg" alt="Foto Detail">
            </div>
            
        </div>
    </div>

    <script href="script.js"></script>
</body>
</html>
